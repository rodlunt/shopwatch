[project]
name = "shopwatch"
version = "0.2.0"
description = "Self-hosted shopping comparison and price-watch board"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "anthropic>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.28", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI's Depends/Body defaults are the documented idiom

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# The field descriptions in offers.py are prompt text, not code: the model reads them
# verbatim, and wrapping them to 100 columns makes them harder to edit and review for
# the thing that actually matters, which is whether they say the right thing.
"app/offers.py" = ["E501"]

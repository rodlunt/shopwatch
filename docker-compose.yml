services:
  shopwatch:
    build: .
    image: shopwatch:latest
    container_name: shopwatch
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SHOPWATCH_DB: /data/shopwatch.db
    ports:
      # Change the left-hand number to move the LAN port. The container port follows
      # SHOPWATCH_PORT in .env, so change both together if you change the container side.
      - "${SHOPWATCH_PORT:-8477}:${SHOPWATCH_PORT:-8477}"
    volumes:
      - shopwatch-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request, os, sys
          url = 'http://127.0.0.1:' + os.environ.get('SHOPWATCH_PORT', '8477') + '/healthz'
          sys.exit(0 if urllib.request.urlopen(url, timeout=8).status == 200 else 1)
      interval: 60s
      timeout: 10s
      start_period: 15s
      retries: 3

volumes:
  shopwatch-data:
    driver: local

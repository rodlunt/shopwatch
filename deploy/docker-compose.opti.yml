# shop.yourdomain.example, deployed at /srv/prod/shopwatch on opti (Dockge-managed).
#
# Layout there:
#   /srv/prod/shopwatch/docker-compose.yml   (copy of this file)
#   /srv/prod/shopwatch/repo                 (clone of /root/shopwatch.git)
#
# Deliberately publishes NO host port. The only way in is Caddy on the `web`
# network, which is what gives it the wildcard cert and keeps it off the LAN
# without a hostname. Mirrors the career-dashboard stack.
services:
  shopwatch:
    build:
      context: ./repo
    container_name: shopwatch
    restart: unless-stopped
    # Non-secret tuning lives here, in git, where it can be reviewed. Only secrets
    # go in the env file.
    environment:
      SHOPWATCH_DB: /data/shopwatch.db
      SHOPWATCH_PORT: "8477"
      SHOPWATCH_UNRESOLVED_FREIGHT_PENALTY: "60"
      SHOPWATCH_STALE_AFTER_DAYS: "7"
      SHOPWATCH_REQUEST_DELAY: "3"
      SHOPWATCH_ALERTS_ENABLED: "true"
    # Rendered from the SOPS vault at smart-home:opti-stacks/shopwatch/secrets.sops.env
    # by sops-render.sh. Carries the ntfy topic URL and publish token and nothing else.
    # Never written by hand: a hand-edited file is one nothing can rotate.
    env_file:
      - .env
    volumes:
      - shopwatch-data:/data
    networks:
      - web
    labels:
      autoheal: "true"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request, os, sys
          url = 'http://127.0.0.1:' + os.environ.get('SHOPWATCH_PORT', '8477') + '/healthz'
          sys.exit(0 if urllib.request.urlopen(url, timeout=8).status == 200 else 1)
      interval: 60s
      timeout: 10s
      # start_interval probes every 5s while the container is still starting, instead
      # of waiting a full `interval`. Without it the first probe result landed around
      # t+60s, and if that one failed the next was t+120s, which is past the deploy
      # script's own wait. The deploy would then fail an application that came up
      # perfectly well. The container runs `python -m app.seed` before uvicorn, so a
      # slow migration is enough to miss the first probe.
      #
      # start_period is 45s rather than 20s for the same reason: fast probing has to
      # still be in force for a realistic startup, or it expires before it helps.
      start_period: 45s
      start_interval: 5s
      retries: 3

volumes:
  shopwatch-data:
    driver: local

networks:
  web:
    external: true

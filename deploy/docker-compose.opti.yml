# shop.home.lunt.au, deployed at /srv/prod/shopwatch on opti (Dockge-managed).
#
# Layout there:
#   /srv/prod/shopwatch/docker-compose.yml   (copy of this file)
#   /srv/prod/shopwatch/repo                 (clone of /root/shopwatch.git)
#
# Deliberately publishes NO host port. The only way in is Caddy on the `web`
# network, which is what gives it the wildcard cert and keeps it off the LAN
# without a hostname. Mirrors the career-dashboard stack.
services:
  shopwatch:
    build:
      context: ./repo
    container_name: shopwatch
    restart: unless-stopped
    environment:
      SHOPWATCH_DB: /data/shopwatch.db
      SHOPWATCH_PORT: "8477"
    # .env is opti-only and never in the repo. It carries SHOPWATCH_NTFY_URL and
    # SHOPWATCH_NTFY_TOKEN when alerting is switched on; with them empty the app
    # still runs and alerts go to the container log only.
    env_file:
      - .env
    volumes:
      - shopwatch-data:/data
    networks:
      - web
    labels:
      autoheal: "true"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request, os, sys
          url = 'http://127.0.0.1:' + os.environ.get('SHOPWATCH_PORT', '8477') + '/healthz'
          sys.exit(0 if urllib.request.urlopen(url, timeout=8).status == 200 else 1)
      interval: 60s
      timeout: 10s
      start_period: 20s
      retries: 3

volumes:
  shopwatch-data:
    driver: local

networks:
  web:
    external: true

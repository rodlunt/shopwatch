name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only by default; no job here needs to write to the repo.
permissions:
  contents: read

# A superseded push should not leave a stale run reporting after the newer one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Three independent jobs on purpose. A failing audit must not stop the tests
  # from reporting their own status, and vice versa: a gate that masks another
  # gate is the bug hardening rule 4 warns about, in reverse.
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install ruff==0.8.6
      - run: ruff check .

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      # Its own job, so a transitive advisory cannot silently stop the tests running.
      - run: pip-audit -r requirements.txt --strict

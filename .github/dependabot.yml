version: 2
updates:
  # Keeps the SHA pins on third-party actions current without hand-checking tags.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Minor and patch bundled so CI is not flooded; majors stay on their own so a
      # breaking change gets its own review.
      minor-and-patch:
        update-types: [minor, patch]
